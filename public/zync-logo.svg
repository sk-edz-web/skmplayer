<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Cyan to Blue Gradient for Ring & Bars -->
    <linearGradient id="zync-ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="zync-bar-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Black Background -->
  <rect width="500" height="500" fill="#070a12" rx="36" />

  <!-- Background Ambient Glow -->
  <circle cx="250" cy="180" r="130" fill="#00f2fe" opacity="0.12" filter="blur(40px)" />

  <!-- CRISP SINGLE MUSIC EMBLEM -->
  <g filter="url(#subtle-glow)">
    <!-- Single Crisp Outer Ring -->
    <circle cx="250" cy="180" r="86" fill="none" stroke="url(#zync-ring-grad)" stroke-width="12" />
    
    <!-- 4 Single Crisp Equalizer Bars -->
    <rect x="204" y="132" width="13" height="96" rx="6.5" fill="url(#zync-bar-grad)" />
    <rect x="228" y="146" width="13" height="68" rx="6.5" fill="url(#zync-bar-grad)" />
    <rect x="252" y="160" width="13" height="40" rx="6.5" fill="url(#zync-bar-grad)" />
    <rect x="276" y="170" width="13" height="20" rx="6.5" fill="url(#zync-bar-grad)" />
  </g>

  <!-- TYPOGRAPHY: ZYNC -->
  <text x="250" y="340" 
        font-family="'Plus Jakarta Sans', 'Syne', system-ui, -apple-system, sans-serif" 
        font-size="62" 
        font-weight="900" 
        text-anchor="middle" 
        letter-spacing="12" 
        fill="#ffffff">ZYNC</text>

  <!-- SUBTITLE: MADE BY SKEDZ -->
  <text x="250" y="388" 
        font-family="'Plus Jakarta Sans', 'Space Grotesk', system-ui, -apple-system, sans-serif" 
        font-size="18" 
        font-weight="800" 
        text-anchor="middle" 
        letter-spacing="8" 
        fill="#00f2fe">MADE BY SKEDZ</text>
</svg>
